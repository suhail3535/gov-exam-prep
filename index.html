<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="UP TGT सामाजिक विज्ञान (विषय कोड 09) — 15 मॉक सेट, 130 प्रश्न, 120 मिनट, उत्तर व व्याख्या सहित।">
<style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>UP TGT मॉक सीरीज़</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Mukta:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: home = 15-set "daily schedule" grid with progress summary; test = sticky exam header + question list + OMR-style navigator */
:root{
  --bg:#F3F5F9; --paper:#FFFFFF; --ink:#1B2445; --muted:#5D6685; --line:#DCE1EC;
  --accent:#C2410C; --accent-soft:#FDEBDD; --ok:#15803D; --ok-soft:#DCF3E3; --bad:#B91C1C; --bad-soft:#FBE1E1; --sel:#1D4ED8; --sel-soft:#E3EAFD; --warn:#B45309;
  --display:"Tiro Devanagari Hindi",serif; --body:"Mukta","Noto Sans Devanagari",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1424; --paper:#171E33; --ink:#E6E9F3; --muted:#9AA3BF; --line:#2A3350;
  --accent:#FB923C; --accent-soft:#3A2416; --ok:#4ADE80; --ok-soft:#15301F; --bad:#F87171; --bad-soft:#3A1A1D; --sel:#7DA2FF; --sel-soft:#1C2A52; --warn:#FBBF24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1424; --paper:#171E33; --ink:#E6E9F3; --muted:#9AA3BF; --line:#2A3350;
  --accent:#FB923C; --accent-soft:#3A2416; --ok:#4ADE80; --ok-soft:#15301F; --bad:#F87171; --bad-soft:#3A1A1D; --sel:#7DA2FF; --sel-soft:#1C2A52; --warn:#FBBF24; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.hleft{display:flex;align-items:center;gap:12px;min-width:0}
.hrow>div:first-child{min-width:0}
h1{font-family:var(--display);font-weight:400;font-size:1.35rem;margin:0;line-height:1.2;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem;letter-spacing:.02em}
.back{font:inherit;font-size:.9rem;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
.timer{font-family:var(--mono);font-size:1.1rem;padding:4px 12px;border:1.5px solid var(--ink);border-radius:6px;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad);border-color:var(--bad)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
.tab{font:inherit;font-size:.95rem;padding:6px 14px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab small{opacity:.7;margin-left:4px;font-family:var(--mono);font-size:.75rem}
button:focus-visible{outline:2px solid var(--sel);outline-offset:2px}

/* home */
.hero{padding-block:28px 8px}
.hero h2{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,4vw,2.3rem);margin:0 0 6px;line-height:1.2;text-wrap:balance}
.hero p{margin:0;color:var(--muted);max-width:62ch}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:18px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted);letter-spacing:.04em}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding-block:22px 80px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.card:hover{border-color:var(--ink)}
.card.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .nm{font-family:var(--display);font-size:1.25rem}
.chip{font-size:.75rem;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.prog{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.na{opacity:.6}
.card .focus{font-size:.85rem;color:var(--muted);line-height:1.4;min-height:2.8em}
.card .sc{font-family:var(--mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--ok)}
.card[disabled]{cursor:not-allowed;opacity:.55}

/* start screen */
.start{max-width:640px;margin:32px auto 80px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px}
.start h2{font-family:var(--display);font-weight:400;font-size:1.8rem;margin:0 0 4px}
.start ul{padding-left:1.2em;margin:14px 0;color:var(--muted)}
.start li{margin-bottom:4px}
.secs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}
.secs div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.95rem}
.secs b{font-family:var(--mono);font-weight:500;float:right}

/* test */
main.test{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px;padding-block:24px 80px}
@media (max-width:820px){main.test{grid-template-columns:minmax(0,1fr)}main.test aside{order:-1}}
.q{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px;scroll-margin-top:130px}
.qh{display:flex;gap:10px;align-items:baseline}
.qn{font-family:var(--mono);font-size:.85rem;color:var(--accent);min-width:2.6em}
.qt{margin:0;font-weight:500;white-space:pre-line;min-width:0}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;font-size:1rem;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
.opt:hover{border-color:var(--sel)}
.opt .l{font-family:var(--mono);font-size:.85rem;width:1.8em;height:1.8em;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%}
.opt.sel{background:var(--sel-soft);border-color:var(--sel)}
.opt.sel .l{background:var(--sel);color:var(--paper);border-color:var(--sel)}
.done .opt{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.right .l{background:var(--ok);color:var(--paper);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .l{background:var(--bad);color:var(--paper);border-color:var(--bad)}
.exp{margin-top:10px;padding:8px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0;font-size:.95rem}
main.test aside{position:sticky;top:140px;align-self:start}
@media (max-width:820px){main.test aside{position:static}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px}
.panel h3{font-size:.8rem;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.cell{font-family:var(--mono);font-size:.75rem;aspect-ratio:1;max-width:100%;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:50%;cursor:pointer;padding:0}
.cell.ans{background:var(--sel);color:var(--paper);border-color:var(--sel)}
.cell.c{background:var(--ok);color:var(--paper);border-color:var(--ok)}
.cell.w{background:var(--bad);color:var(--paper);border-color:var(--bad)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
.btn{font:inherit;font-weight:700;width:100%;margin-top:12px;padding:10px;border-radius:8px;border:none;background:var(--accent);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.confirm{margin-top:10px;font-size:.9rem}
.confirm .row{display:flex;gap:8px}
.result{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
.score{font-family:var(--display);font-size:2.4rem;line-height:1}
.score small{font-size:1rem;color:var(--muted);font-family:var(--body)}
.bars{display:grid;gap:8px;margin-top:14px}
.bar{display:grid;grid-template-columns:7.5em minmax(0,1fr) 4.5em;gap:10px;align-items:center;font-size:.9rem}
.bar .track{height:8px}
.bar span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.msg{padding:40px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
.hright{display:flex;align-items:center;gap:8px}
.theme{width:38px;height:38px;flex:none;display:grid;place-items:center;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;cursor:pointer;padding:0}
.theme svg{width:18px;height:18px}
.theme .moon{display:block}.theme .sun{display:none}
:root[data-theme="dark"] .theme .moon{display:none}:root[data-theme="dark"] .theme .sun{display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .theme .moon{display:none}:root:not([data-theme="light"]) .theme .sun{display:block}}
.mbar,.sheet-head{display:none}

/* phone */
@media (max-width:820px){
  body{font-size:16px}
  h1{font-size:1.1rem}
  .hrow{padding-block:8px;flex-wrap:nowrap}
  .hleft{gap:8px}
  .test-h .sub{display:none}
  .back{padding:4px 8px;font-size:.85rem;white-space:nowrap}
  .timer{font-size:.95rem;padding:3px 8px}
  .tab{font-size:.85rem;padding:5px 11px}
  .tabs{padding-bottom:8px;scrollbar-width:none}
  .q{padding:14px;scroll-margin-top:118px}
  .opt{padding:9px 10px;min-height:44px}
  .hero{padding-block:20px 4px}
  .stats{gap:22px}
  .stat b{font-size:1.6rem}
  .sets{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding-block:18px 60px}
  .card{padding:12px}
  .card .nm{font-size:1.1rem}
  .start{margin:18px auto 60px;padding:18px}
  .bar{grid-template-columns:6.5em minmax(0,1fr) 3.6em}
  .score{font-size:2rem}
  main.test{padding-block:16px 96px}
  main.test aside{position:fixed;left:0;right:0;bottom:0;z-index:20;order:0;top:auto;max-height:78vh;overflow:auto;transform:translateY(105%);transition:transform .22s ease;
    padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
  main.test aside.open{transform:none;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
  main.test aside .panel{border-radius:14px 14px 0 0;border-bottom:none;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .sheet-head h3{margin:0}
  .grid{grid-template-columns:repeat(8,1fr)}
  .mbar{display:flex;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--paper);border-top:1px solid var(--line);
    padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .mbar .btn{margin:0}
  .shade{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:19}
}
@media (prefers-reduced-motion:reduce){main.test aside{transition:none}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const SETS=15, DUR=120*60*1000, TOTAL=130;
const SECTIONS=[{key:"anc",name:"प्राचीन भारत",n:30},{key:"med",name:"मध्यकालीन भारत",n:30},{key:"mod",name:"आधुनिक भारत",n:30},{key:"civ",name:"नागरिक शास्त्र",n:40}];
const FOCUS=["","संपूर्ण पाठ्यक्रम · आधार सेट","कला-स्थापत्य, स्रोत · संविधान के अनुच्छेद","प्रशासन, राजस्व, अर्थव्यवस्था · राजनीतिक चिंतक","धर्म, समाज सुधार · मौलिक अधिकार व DPSP","युद्ध, संधियाँ, कालक्रम · संसद","उत्तर प्रदेश से जुड़े प्रश्न · राष्ट्रपति, प्रधानमंत्री","विदेशी यात्री, व्यक्तित्व · न्यायपालिका","अधिवेशन, समाचार पत्र, राजधानियाँ · चुनाव व दल","कालक्रम व सुमेलन अभ्यास · राज्य सरकार, पंचायत","कथन व अभिकथन-कारण · विचारधाराएँ व अवधारणाएँ","राष्ट्रीय नेता, संविधान निर्माण · संघवाद","कम पूछे गए टॉपिक · नौकरशाही, लोकपाल","शब्दावली, 'असत्य कथन' · लोकतंत्र की चुनौतियाँ","सर्वाधिक दोहराए गए PYQ तथ्य · कठिन","अंतिम परीक्षा सिमुलेशन"];
const LET=["a","b","c","d"];
const KEY="uptgt-series-v1";
let S={sets:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.sets)S=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const cache={};let avail={};
let view={set:null,tab:"anc",filter:"all"},Q=[],timerId=null;
const $=id=>document.getElementById(id);
const TKEY="uptgt-theme";
try{const t=localStorage.getItem(TKEY);if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}
function isDark(){const a=document.documentElement.getAttribute("data-theme");return a?a==="dark":matchMedia("(prefers-color-scheme: dark)").matches;}
function toggleTheme(){const t=isDark()?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem(TKEY,t);}catch(e){}}
const THEME_BTN=`<button class="theme" data-theme-toggle aria-label="लाइट / डार्क मोड बदलें" title="लाइट / डार्क मोड"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.2M12 19.8V22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2 12h2.2M19.8 12H22M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/></svg></button>`;
function sheet(open){const a=document.querySelector("main.test aside");if(!a)return;a.classList.toggle("open",open);const sh=$("shade");if(sh)sh.hidden=!open;}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

async function load(n){
  if(cache[n])return cache[n];
  const r=await fetch(`sets/set${pad(n)}.json`);if(!r.ok)throw new Error("missing");
  const D=await r.json();const out=[];let k=0;
  SECTIONS.forEach(s=>(D[s.key]||[]).forEach(row=>{k++;const R=rng(n*100003+k*7919);
    const opts=[{t:row[1],c:1},{t:row[2]},{t:row[3]},{t:row[4]}];
    for(let i=3;i>0;i--){const j=Math.floor(R()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
    out.push({n:k,sec:s.key,text:row[0],opts,ans:opts.findIndex(o=>o.c),exp:row[5]});}));
  cache[n]=out;return out;
}
async function probe(){
  await Promise.all(Array.from({length:SETS},(_,i)=>i+1).map(async n=>{
    try{const r=await fetch(`sets/set${pad(n)}.json`,{method:"HEAD"});avail[n]=r.ok;}catch(e){avail[n]=false;}}));
}
function st(n){return S.sets[n]||(S.sets[n]={answers:{},end:null,submitted:false});}
function scoreOf(n,qs){const s=st(n);const by={};let tot=0,att=0;
  SECTIONS.forEach(x=>by[x.key]=0);
  qs.forEach(q=>{const a=s.answers[q.n];if(a!=null)att++;if(a===q.ans){tot++;by[q.sec]++;}});
  return {tot,att,by};}

/* ---------- HOME ---------- */
function home(){
  clearInterval(timerId);
  const done=Object.entries(S.sets).filter(([k,v])=>v.submitted&&v.result);
  const avg=done.length?Math.round(done.reduce((a,[k,v])=>a+v.result.tot,0)/done.length):null;
  const best=done.length?Math.max(...done.map(([k,v])=>v.result.tot)):null;
  let nextN=null;for(let i=1;i<=SETS;i++){if(avail[i]&&!(S.sets[i]&&S.sets[i].submitted)){nextN=i;break;}}
  const cards=Array.from({length:SETS},(_,i)=>{const n=i+1;const s=S.sets[n];let chip,extra="";
    if(!avail[n])chip=`<span class="chip na">जल्द आ रहा है</span>`;
    else if(s&&s.submitted&&s.result){chip=`<span class="chip done">पूरा</span>`;
      extra=`<div class="sc">${s.result.tot}/${TOTAL} · ${Math.round(s.result.tot/TOTAL*100)}%</div><div class="track"><div class="fill" style="width:${s.result.tot/TOTAL*100}%"></div></div>`;}
    else if(s&&s.end){const left=Math.max(0,s.end-Date.now());chip=`<span class="chip prog">जारी · ${Math.ceil(left/60000)} मिनट बाकी</span>`;}
    else chip=`<span class="chip">शुरू नहीं</span>`;
    return `<button class="card${n===nextN?" next":""}" data-open="${n}" ${avail[n]?"":"disabled"}><div class="top"><span class="nm">सेट ${pad(n)}</span>${chip}</div><div class="focus">${FOCUS[n]}</div>${extra}</button>`;}).join("");
  $("app").innerHTML=`<header><div class="wrap"><div class="hrow"><div><h1>UP TGT सामाजिक विज्ञान · मॉक सीरीज़</h1><div class="sub">विषय कोड 09 · 15 सेट · प्रतिदिन 1 सेट · 130 प्रश्न / 120 मिनट</div></div>${THEME_BTN}</div></div></header>
  <div class="wrap"><section class="hero"><h2>${nextN?`आज का सेट: सेट ${pad(nextN)}`:"सभी उपलब्ध सेट पूरे"}</h2>
  <p>हर सेट में प्राचीन 30, मध्यकालीन 30, आधुनिक 30 और नागरिक शास्त्र 40 प्रश्न हैं। प्रश्न पिछले वर्षों के UP TGT/PGT व UPPSC पैटर्न पर आधारित हैं। जमा करने के बाद सही उत्तर, व्याख्या और खण्डवार अंक दिखेंगे।</p>
  <div class="stats"><div class="stat"><b>${done.length}/${SETS}</b><span>सेट पूरे</span></div><div class="stat"><b>${avg??"—"}</b><span>औसत अंक / ${TOTAL}</span></div><div class="stat"><b>${best??"—"}</b><span>सर्वश्रेष्ठ / ${TOTAL}</span></div></div></section>
  <section class="sets" aria-label="सभी सेट">${cards}</section></div>`;
}

/* ---------- START SCREEN ---------- */
function startScreen(n){
  $("app").innerHTML=`<header><div class="wrap"><div class="hrow"><div class="hleft"><button class="back" data-home>← सभी सेट</button><h1>सेट ${pad(n)}</h1></div>${THEME_BTN}</div></div></header>
  <div class="wrap"><div class="start"><h2>सेट ${pad(n)}</h2><div class="sub">${FOCUS[n]}</div>
  <div class="secs">${SECTIONS.map(s=>`<div>${s.name}<b>${s.n}</b></div>`).join("")}</div>
  <ul><li>कुल 130 प्रश्न, समय 120 मिनट। प्रत्येक प्रश्न 1 अंक, कोई ऋणात्मक अंकन नहीं।</li>
  <li>"शुरू करें" दबाते ही टाइमर चालू होगा और ऐप बंद करने पर भी चलता रहेगा, जैसे असली परीक्षा में।</li>
  <li>उत्तर अपने-आप सहेजे जाते हैं। उसी विकल्प को फिर दबाने पर उत्तर हट जाएगा।</li>
  <li>समय खत्म होने पर टेस्ट अपने-आप जमा हो जाएगा।</li></ul>
  <button class="btn" data-begin="${n}">शुरू करें</button></div></div>`;
}

/* ---------- TEST ---------- */
async function openSet(n){
  view={set:n,tab:"anc",filter:"all"};
  $("app").innerHTML=`<div class="msg">सेट ${pad(n)} लोड हो रहा है…</div>`;
  try{Q=await load(n);}catch(e){$("app").innerHTML=`<div class="msg">सेट ${pad(n)} अभी उपलब्ध नहीं है। <button class="back" data-home>वापस</button></div>`;return;}
  const s=st(n);
  if(!s.end&&!s.submitted){startScreen(n);return;}
  if(s.submitted)view.tab="res";
  renderTest();
}
function renderTest(){
  const n=view.set,s=st(n);
  $("app").innerHTML=`<header class="test-h"><div class="wrap"><div class="hrow"><div class="hleft"><button class="back" data-home>← सभी सेट</button><div><h1>सेट ${pad(n)}</h1><div class="sub">${FOCUS[n]}</div></div></div><div class="hright"><div class="timer" id="timer">—</div>${THEME_BTN}</div></div><div class="tabs" role="tablist" id="tabs"></div></div></header>
  <div class="wrap"><main class="test"><section id="list" aria-live="polite"></section><aside><div class="panel"><div class="sheet-head"><h3>उत्तर पत्रक</h3><button class="back" data-close>बंद करें ✕</button></div><h3 id="navTitle"></h3><div class="grid" id="grid"></div><div class="legend" id="legend"></div><div id="actions"></div></div></aside></main></div>
  <div class="shade" id="shade" data-close hidden></div><div class="mbar" id="mbar"></div>`;
  renderTabs();renderList();renderGrid();
  clearInterval(timerId);tick();timerId=setInterval(tick,1000);
}
function renderTabs(){const s=st(view.set);
  $("tabs").innerHTML=SECTIONS.map(x=>{const qs=Q.filter(q=>q.sec===x.key);const a=qs.filter(q=>s.answers[q.n]!=null).length;
   const c=s.submitted?qs.filter(q=>s.answers[q.n]===q.ans).length:a;
   return `<button class="tab" role="tab" aria-selected="${view.tab===x.key}" data-t="${x.key}">${x.name}<small>${c}/${qs.length}</small></button>`}).join("")
   +(s.submitted?`<button class="tab" role="tab" aria-selected="${view.tab==="res"}" data-t="res">परिणाम</button>`:"");}
function resultHTML(){const s=st(view.set);const r=scoreOf(view.set,Q);
  const rows=SECTIONS.map(x=>{const t=Q.filter(q=>q.sec===x.key).length;return `<div class="bar"><span>${x.name}</span><div class="track"><div class="fill" style="width:${r.by[x.key]/t*100}%"></div></div><span>${r.by[x.key]}/${t}</span></div>`}).join("");
  const weak=SECTIONS.map(x=>({x,p:r.by[x.key]/x.n})).sort((a,b)=>a.p-b.p)[0];
  return `<div class="result"><div class="sub">कुल अंक</div><div class="score">${r.tot} <small>/ ${TOTAL} · ${Math.round(r.tot/TOTAL*100)}% · हल किए ${r.att} · गलत ${r.att-r.tot} · छोड़े ${TOTAL-r.att}</small></div><div class="bars">${rows}</div>
  <p class="sub" style="margin-top:14px">सबसे कमज़ोर खण्ड: <b>${weak.x.name}</b>। किसी भी खण्ड के टैब में सही उत्तर हरे और आपका गलत उत्तर लाल दिखेगा, साथ में व्याख्या भी।</p>
  <button class="btn ghost" id="restart">यह सेट दोबारा हल करें</button></div>`;}
function renderList(){const s=st(view.set);const L=$("list");
  if(view.tab==="res"){L.innerHTML=resultHTML();return;}
  const sec=SECTIONS.find(x=>x.key===view.tab);const all=Q.filter(q=>q.sec===view.tab);let qs=all;let head="";
  if(s.submitted){head=`<div class="filter">${[["all","सभी"],["w","केवल गलत"],["s","छोड़े गए"]].map(([k,l])=>`<button class="tab" aria-selected="${view.filter===k}" data-f="${k}">${l}</button>`).join("")}</div>`;
    if(view.filter==="w")qs=qs.filter(q=>s.answers[q.n]!=null&&s.answers[q.n]!==q.ans);
    if(view.filter==="s")qs=qs.filter(q=>s.answers[q.n]==null);}
  L.innerHTML=head+`<h2 class="sub" style="margin:0 0 10px;font-weight:400">${sec.name} · प्रश्न ${all[0].n}–${all[all.length-1].n}</h2>`+
  (qs.length?qs.map(q=>{const my=s.answers[q.n];
   return `<article class="q${s.submitted?" done":""}" id="q${q.n}"><div class="qh"><span class="qn">${q.n}.</span><p class="qt">${esc(q.text)}</p></div>
   <div class="opts">${q.opts.map((o,i)=>{let c="";if(s.submitted){if(i===q.ans)c="right";else if(i===my)c="wrong";}else if(i===my)c="sel";
    return `<button class="opt ${c}" data-q="${q.n}" data-i="${i}" ${s.submitted?'tabindex="-1"':""}><span class="l">${LET[i]}</span><span>${esc(o.t)}</span></button>`}).join("")}</div>
   ${s.submitted?`<div class="exp">${my==null?"<b>छोड़ा गया।</b> ":""}${esc(q.exp)}</div>`:""}</article>`}).join(""):`<p class="sub">इस श्रेणी में कोई प्रश्न नहीं।</p>`);}
function renderGrid(){const s=st(view.set);const qs=view.tab==="res"?Q:Q.filter(q=>q.sec===view.tab);
  $("navTitle").textContent=view.tab==="res"?"पूरा उत्तर पत्रक":"उत्तर पत्रक · "+SECTIONS.find(x=>x.key===view.tab).name;
  $("grid").innerHTML=qs.map(q=>{const my=s.answers[q.n];let c="";if(s.submitted){if(my!=null)c=my===q.ans?"c":"w";}else if(my!=null)c="ans";
   return `<button class="cell ${c}" data-go="${q.n}" aria-label="प्रश्न ${q.n}">${q.n}</button>`}).join("");
  $("legend").innerHTML=s.submitted?`<span><i style="background:var(--ok)"></i>सही</span><span><i style="background:var(--bad)"></i>गलत</span><span><i style="border:1px solid var(--line)"></i>छोड़ा</span>`
   :`<span><i style="background:var(--sel)"></i>उत्तर दिया</span><span><i style="border:1px solid var(--line)"></i>बाकी</span>`;
  const att=Object.keys(s.answers).length;
  if($("mbar"))$("mbar").innerHTML=s.submitted
   ?`<button class="btn ghost" data-sheet>उत्तर पत्रक</button>${view.tab==="res"?"":`<button class="btn" data-t="res">परिणाम</button>`}`
   :`<button class="btn" data-sheet>उत्तर पत्रक व जमा करें · ${att}/${TOTAL}</button>`;
  $("actions").innerHTML=s.submitted?(view.tab==="res"?"":`<button class="btn ghost" data-t="res">परिणाम देखें</button>`)
   :`<button class="btn" id="submit">टेस्ट जमा करें (${att}/${TOTAL})</button><div id="confirm"></div>`;}
function submit(){const n=view.set,s=st(n);if(s.submitted)return;s.submitted=true;s.result=scoreOf(n,Q);s.at=Date.now();save();view.tab="res";renderTabs();renderList();renderGrid();tick();window.scrollTo(0,0);}
function tick(){const t=$("timer");if(!t)return;const s=st(view.set);
  if(s.submitted){t.textContent=`${s.result?s.result.tot:"—"}/${TOTAL}`;t.classList.remove("low");return;}
  const left=Math.max(0,s.end-Date.now());t.textContent=pad(Math.floor(left/60000))+":"+pad(Math.floor(left%60000/1000));t.classList.toggle("low",left<10*60000);
  if(left<=0)submit();}

/* ---------- ROUTING & EVENTS ---------- */
function route(){const m=location.hash.match(/^#set-(\d+)$/);if(m&&+m[1]>=1&&+m[1]<=SETS)openSet(+m[1]);else{view.set=null;home();}}
function go(h){if(location.hash===h)route();else location.hash=h;}
document.addEventListener("click",e=>{
  if(e.target.closest("[data-close]")){sheet(false);return;}
  const el=e.target.closest("button");if(!el)return;
  if(el.hasAttribute("data-theme-toggle")){toggleTheme();return;}
  if(el.hasAttribute("data-sheet")){sheet(true);return;}
  if(el.hasAttribute("data-home")){go("#home");return;}
  if(el.dataset.open){go("#set-"+el.dataset.open);return;}
  if(el.dataset.begin){const s=st(+el.dataset.begin);s.end=Date.now()+DUR;s.answers={};save();renderTest();window.scrollTo(0,0);return;}
  if(el.dataset.t){sheet(false);view.tab=el.dataset.t;view.filter="all";renderTabs();renderList();renderGrid();window.scrollTo(0,0);return;}
  if(el.dataset.f){view.filter=el.dataset.f;renderList();return;}
  if(el.id==="submit"){const att=Object.keys(st(view.set).answers).length;$("confirm").innerHTML=`<div class="confirm">${TOTAL-att} प्रश्न बाकी हैं। जमा करने के बाद उत्तर बदले नहीं जा सकेंगे।<div class="row"><button class="btn" id="yes">हाँ, जमा करें</button><button class="btn ghost" id="no">वापस</button></div></div>`;return;}
  if(el.id==="yes"){sheet(false);submit();return;}
  if(el.id==="no"){$("confirm").innerHTML="";return;}
  if(el.id==="restart"){if(el.dataset.armed){S.sets[view.set]={answers:{},end:null,submitted:false};save();startScreen(view.set);window.scrollTo(0,0);}
    else{el.dataset.armed="1";el.textContent="पक्का? इस सेट के पिछले उत्तर और अंक मिट जाएँगे। फिर से दबाएँ";}return;}
  if(el.classList.contains("opt")){const s=st(view.set);if(s.submitted)return;const q=+el.dataset.q,i=+el.dataset.i;
    if(s.answers[q]===i)delete s.answers[q];else s.answers[q]=i;save();
    el.closest(".q").querySelectorAll(".opt").forEach((b,k)=>b.classList.toggle("sel",s.answers[q]===k));renderTabs();renderGrid();return;}
  if(el.dataset.go){sheet(false);const q=Q[+el.dataset.go-1];if(view.tab!==q.sec){view.tab=q.sec;view.filter="all";renderTabs();renderList();renderGrid();}
    const a=$("q"+q.n);if(a)a.scrollIntoView({block:"start"});}
});
window.addEventListener("hashchange",route);
$("app").innerHTML=`<div class="msg">लोड हो रहा है…</div>`;
probe().then(route);
</script>
</body>
</html>
